; Mouse Shortcuts config
; Edit with open-control-panel.cmd, mouse-shortcuts-panel.ahk, or by hand.
; Set an action or text hotkey to disabled to keep it visible but inactive.

[Settings]
language=zh-CN

[Slots]
middle=MButton
side_up=XButton2
side_down=XButton1
wheel_up=WheelUp
wheel_down=WheelDown
wheel_left=WheelLeft
wheel_right=WheelRight
browser_back=Browser_Back
browser_forward=Browser_Forward
launch_app1=Launch_App1
launch_app2=Launch_App2
extra_1=F13
extra_2=F14
extra_3=F15
extra_4=F16

[Mappings]
MButton=voice
XButton2=enter
XButton1=backspace
Browser_Back=backspace
Launch_App1=backspace

[TextHotkeys]
snippet_1=^!1
snippet_2=disabled
snippet_3=disabled
snippet_4=disabled
snippet_5=disabled

[Snippets]
snippet_1=snippets\snippet_1.txt
snippet_2=snippets\snippet_2.txt
snippet_3=snippets\snippet_3.txt
snippet_4=snippets\snippet_4.txt
snippet_5=snippets\snippet_5.txt

[Actions]
enter={Enter}
backspace={Backspace}
delete={Delete}
voice=#h
copy=^c
paste=^v
cut=^x
select_all=^a
undo=^z
redo=^y
escape={Esc}
tab={Tab}
space={Space}
home={Home}
end={End}
page_up={PgUp}
page_down={PgDn}
browser_back=!{Left}
browser_forward=!{Right}
desktop=#d
lock=#l
snip=#+s
volume_mute={Volume_Mute}
volume_down={Volume_Down}
volume_up={Volume_Up}
media_play_pause={Media_Play_Pause}
media_next={Media_Next}
media_prev={Media_Prev}
media_stop={Media_Stop}
