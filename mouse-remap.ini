; Mouse Shortcuts config
;
; Left side = the key AutoHotkey detects.
; Right side = an action name from [Actions], or a raw AutoHotkey SendInput string.
;
; Use key-test.ahk if you are not sure what your mouse button is called.

[Mappings]
XButton2=enter
XButton1=backspace
Browser_Back=backspace
Launch_App1=backspace
MButton=voice

[Actions]
enter={Enter}
backspace={Backspace}
delete={Delete}
voice=#h
copy=^c
paste=^v
cut=^x
select_all=^a
undo=^z
redo=^y
escape={Esc}
tab={Tab}
space={Space}
browser_back=!{Left}
browser_forward=!{Right}
desktop=#d
lock=#l
snip=#+s
